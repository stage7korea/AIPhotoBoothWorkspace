<title>AI 포토부스 9안 · 라이브 강조 탭 확장형</title>
<style>
:root{--bg:#eeeae4;--paper:#fffdf9;--soft:#f3efe8;--ink:#282725;--muted:#77716a;--line:#d8d1c7;--key:#2d6a5c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}button{font:inherit;color:inherit}.booth{width:min(100%,430px);height:min(94vh,calc(100vw * 1.5));aspect-ratio:4/6;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--paper);box-shadow:0 18px 45px rgba(43,37,30,.15)}.head{flex:0 0 6%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:10px}.head span:nth-child(2){text-align:center}.head span:last-child{color:var(--muted);text-align:right}.live{position:relative;flex:0 0 24%;overflow:hidden;transition:background .55s ease}.live.theme-studio{background:radial-gradient(circle at 50% 27%,#d8c6b1 0 13%,transparent 13.5%),linear-gradient(145deg,#ece1d2,#94b6ae)}.live.theme-space{background:radial-gradient(circle at 73% 24%,#f5d16e 0 7%,transparent 8%),radial-gradient(circle at 22% 32%,#fff 0 1%,transparent 2%),linear-gradient(145deg,#132552,#654487)}.live.theme-forest{background:radial-gradient(circle at 70% 25%,#f3d596 0 7%,transparent 8%),linear-gradient(145deg,#1f5544,#9eb475)}.live.theme-retro{background:repeating-radial-gradient(circle at 65% 45%,rgba(30,48,77,.45) 0 1px,transparent 1px 7px),linear-gradient(135deg,#f2c832,#d44c43 50%,#2e68a6 51%)}.live.theme-hanok{background:linear-gradient(28deg,transparent 0 46%,rgba(76,48,34,.45) 47% 52%,transparent 53%),linear-gradient(145deg,#e4cda9,#8f6b52)}.live.theme-beach{background:linear-gradient(#84c8dd 0 48%,#e7d093 49% 100%)}.live.theme-neon{background:linear-gradient(120deg,#101b35,#5c1b73 48%,#0b6f79)}.live.theme-snow{background:radial-gradient(circle at 20% 25%,#fff 0 2%,transparent 3%),linear-gradient(145deg,#e9f3f7,#a6c1cf)}.live.theme-europe{background:linear-gradient(90deg,#d4b48d 0 30%,#9d6c55 31% 45%,#c5a179 46% 70%,#6e8f9a 71%)}.live.theme-garden{background:radial-gradient(circle at 20% 35%,#e67599 0 5%,transparent 6%),radial-gradient(circle at 75% 27%,#f0c153 0 5%,transparent 6%),linear-gradient(145deg,#7dab78,#d9d4a8)}.person{position:absolute;left:50%;bottom:-14%;width:42%;height:67%;transform:translateX(-50%);border-radius:48% 48% 10% 10%;transition:background .45s ease}.person.outfit-casual{background:linear-gradient(90deg,#d38b66 0 50%,#466e9b 51%)}.person.outfit-suit{background:linear-gradient(90deg,#273852 0 44%,#d1a56a 45% 55%,#273852 56%)}.person.outfit-hanbok{background:linear-gradient(90deg,#b8677e 0 48%,#e7c67c 49%)}.person.outfit-fantasy{background:linear-gradient(135deg,#6a4b8d,#b2d1d2 52%,#d798b7 53%)}.person.outfit-denim{background:repeating-linear-gradient(90deg,#315a80 0 5px,#456f94 5px 10px)}.person.outfit-sports{background:linear-gradient(90deg,#e6654c 0 45%,#f1f1e7 46% 55%,#2f5f8d 56%)}.person.outfit-dress{background:linear-gradient(120deg,#c87b95,#e5b8c8 48%,#9b5872 49%)}.person.outfit-school{background:linear-gradient(90deg,#36465f 0 45%,#ebe6dc 46% 55%,#36465f 56%)}.person.outfit-space{background:linear-gradient(90deg,#c9d1d6 0 42%,#eb7d42 43% 55%,#c9d1d6 56%)}.person.outfit-vintage{background:repeating-linear-gradient(45deg,#835f43 0 8px,#b58a62 8px 16px)}.guide{position:absolute;left:50%;top:11%;width:38%;height:61%;transform:translateX(-50%);border:2px solid rgba(255,255,255,.85);border-radius:48% 48% 38% 38%}.live-badge{position:absolute;z-index:3;top:8px;left:9px;padding:4px 8px;border-radius:999px;background:rgba(40,39,37,.68);color:#fff;font-size:9px}.done{position:absolute;z-index:3;top:8px;right:9px;border:1px solid var(--key);border-radius:8px;background:var(--key);color:#fff;padding:6px 10px;cursor:pointer;font-size:10px;font-weight:700}.live-text{position:absolute;z-index:3;right:8px;bottom:7px;display:grid;gap:3px;justify-items:end;color:#fff;font-size:9px}.live-text span{padding:3px 7px;border-radius:999px;background:rgba(40,39,37,.68)}.summary{flex:0 0 6%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 11px;border-bottom:1px solid var(--line);background:var(--soft);font-size:9px}.summary span{color:var(--muted)}.summary strong{overflow:hidden;text-align:right;text-overflow:ellipsis;white-space:nowrap}.menus{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,1fr);padding:2px 10px}.rail{position:relative;min-height:0;padding:4px 0;border-bottom:1px solid var(--line)}.rail:last-child{border-bottom:0}.rail-head{position:relative;z-index:20;display:flex;justify-content:space-between;gap:6px;height:15px;padding:0 2px 3px;background:var(--paper);font-size:9px}.rail-current{max-width:58%;overflow:hidden;color:var(--muted);text-overflow:ellipsis;white-space:nowrap}.flow{position:relative;height:calc(100% - 15px);overflow:hidden;perspective:900px;mask-image:linear-gradient(90deg,transparent,black 4%,black 96%,transparent)}.flow-card{position:absolute;top:50%;left:50%;width:19%;aspect-ratio:1;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer;text-align:left;opacity:0;pointer-events:none;transition:transform .58s cubic-bezier(.2,.75,.25,1),opacity .58s ease,filter .58s ease,border-color .58s ease;transform-origin:center}.flow-card.is-visible{pointer-events:auto}.flow-card.is-center{border-color:var(--key);opacity:1;box-shadow:inset 0 0 0 1px var(--key),0 5px 12px rgba(34,39,36,.15)}.flow-card.is-side{opacity:.68;filter:saturate(.8)}.flow-card.is-far{opacity:.42;filter:saturate(.6)}.flow-card strong{display:block;overflow:hidden;margin-top:2px;text-overflow:ellipsis;white-space:nowrap;font-size:8px}.thumb{display:block;width:100%;height:calc(100% - 13px);border-radius:5px}.tone-0{background:linear-gradient(145deg,#d8cbb9,#88afa5)}.tone-1{background:radial-gradient(circle at 70% 30%,#f6d074 0 8%,transparent 9%),linear-gradient(145deg,#162a56,#614682)}.tone-2{background:linear-gradient(145deg,#285342,#9cae73)}.tone-3{background:repeating-radial-gradient(circle at 60% 50%,#303b58 0 1px,transparent 1px 6px),linear-gradient(135deg,#efc62e,#cf4b44 50%,#2d66a3 51%)}.tone-4{background:linear-gradient(135deg,#b8677e,#e7c67c)}.tone-5{background:linear-gradient(135deg,#66abc6,#e4cf91)}.tone-6{background:linear-gradient(135deg,#1f2752,#a33aa0)}.tone-7{background:linear-gradient(135deg,#edf4f6,#91adbd)}.tone-8{background:linear-gradient(135deg,#c7a27b,#6f8f9b)}.tone-9{background:radial-gradient(circle at 30% 40%,#e8709a 0 8%,transparent 9%),linear-gradient(135deg,#7fac7d,#ead6ad)}@media(max-width:430px){body{padding:0}.booth{width:100%;height:100vh;border-radius:0}.head{font-size:9px}}
/* 16:9 라이브 화면 · 압축 설정 영역 · 7장 겹침 커버 플로우 */
.live{flex:0 0 auto;width:100%;aspect-ratio:16/9}
.menus{flex:0 0 43%;padding:2px 10px}
.rail{padding:3px 0}
.rail-head{height:13px;padding:0 2px 2px;font-size:8px}
.rail-current{text-align:right}
.flow{height:calc(100% - 13px);mask-image:linear-gradient(90deg,transparent,black 3%,black 97%,transparent)}
.flow-card{width:18%}
.flow-card.is-far{opacity:.5;filter:saturate(.68)}
.flow-card.is-edge{opacity:.3;filter:saturate(.5)}
.flow-card.is-right,.flow-card.is-right strong{text-align:right}
.flow-card.is-center,.flow-card.is-center strong{text-align:center}
.flow-card strong{font-size:7px}
.thumb{height:calc(100% - 11px)}
.flow-card{width:auto;height:calc(100% - 4px);max-height:58px}
.rail-head{align-items:center}
.people{display:flex;align-items:center;justify-content:center;gap:3px;margin-left:auto}
.person-shot{position:relative;width:17px;height:17px;padding:0;overflow:hidden;border:1px solid #c9c0b5;border-radius:4px;background:linear-gradient(145deg,#cfd9d6,#a8b9b4);cursor:pointer}
.person-shot::before{content:"";position:absolute;left:50%;top:3px;width:6px;height:6px;transform:translateX(-50%);border-radius:50%;background:#a8765c}
.person-shot::after{content:"";position:absolute;left:50%;bottom:-3px;width:12px;height:9px;transform:translateX(-50%);border-radius:7px 7px 2px 2px;background:#526f86}
.person-shot:nth-child(2){background:linear-gradient(145deg,#ead3bd,#b9a28c)}
.person-shot:nth-child(2)::after{background:#85634e}
.person-shot:nth-child(3){background:linear-gradient(145deg,#d9cfeb,#aaa0c6)}
.person-shot:nth-child(3)::after{background:#6e5687}
.person-shot.is-active{border-color:var(--key);box-shadow:0 0 0 1px var(--key)}
.person-shot span{position:absolute;z-index:2;right:1px;bottom:1px;display:grid;width:7px;height:7px;place-items:center;border-radius:2px;background:rgba(26,31,29,.72);color:#fff;font-size:5px;line-height:1}
.rail[data-kind="outfit"] .rail-current,.rail[data-kind="face"] .rail-current{max-width:33%}
.live-text{grid-template-columns:auto auto;max-width:78%}
.live-text span{white-space:nowrap}
/* 안 8-B · 라이브 우측 인물 선택 패널 */
.live{width:124%;align-self:center;aspect-ratio:16/9}
.live-badge{left:calc(9.7% + 9px)}
.done{right:calc(9.7% + 9px)}
.live-text{right:auto;left:calc(9.7% + 8px);max-width:62%;justify-items:start;grid-template-columns:auto auto}
.live-people{position:absolute;z-index:5;right:calc(9.7% + 7px);top:50%;display:grid;gap:5px;padding:5px;transform:translateY(-43%);border:1px solid rgba(255,255,255,.4);border-radius:10px;background:rgba(31,34,32,.34);backdrop-filter:blur(5px)}
.live-people::before{content:"인물";color:#fff;text-align:center;font-size:7px;font-weight:700}
.live-people .person-shot{width:33px;height:38px;border-radius:7px;border-color:rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.live-people .person-shot::before{top:7px;width:12px;height:12px}
.live-people .person-shot::after{bottom:-4px;width:25px;height:19px;border-radius:12px 12px 3px 3px}
.live-people .person-shot span{right:2px;bottom:2px;width:11px;height:11px;border-radius:3px;font-size:7px}
.live-people .person-shot.is-active{border-color:#fff;box-shadow:0 0 0 2px var(--key),0 3px 8px rgba(0,0,0,.28)}
.rail-scope{color:var(--key);font-size:7px;font-weight:700}
/* 남는 높이는 설정 UI가 사용하고, 라이브 선택값은 해시태그로 표시 */
.menus{flex:1 1 auto}
.live-text{display:flex;flex-wrap:wrap;align-content:flex-end;gap:4px;max-width:64%}
.live-text span{padding:4px 7px;border:1px solid rgba(255,255,255,.3);background:rgba(28,31,29,.58);backdrop-filter:blur(4px);font-weight:700;letter-spacing:-.02em}
/* 늘어난 설정 행에 맞춰 카드도 제한 없이 확대 */
.flow-card{height:calc(100% - 4px);max-height:none;padding:4px}
.flow-card strong{font-size:8px}
.thumb{height:calc(100% - 13px)}
.thumb.has-image{background-repeat:no-repeat;background-size:cover;background-position:center}
.rail[data-kind="outfit"] .thumb.has-image{background-position:top center}
.person.person-photo{bottom:-7%;width:38%;height:88%;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-position:center bottom;background-size:contain}
/* 사진 프레임 선택 */
.menus{grid-template-rows:repeat(5,1fr)}
.live::after{content:"";position:absolute;z-index:2;left:10.7%;right:10.7%;top:5px;bottom:5px;border:5px solid rgba(255,255,255,.95);border-radius:3px;pointer-events:none;transition:border .3s ease,box-shadow .3s ease}
.live[data-frame="frame-black"]::after{border-color:#171717}
.live[data-frame="frame-gold"]::after{border-color:#c79a3b;box-shadow:inset 0 0 0 2px #f3d793}
.live[data-frame="frame-film"]::after{border-width:7px;border-color:#171717;border-style:dashed}
.live[data-frame="frame-pastel"]::after{border-color:#e9b8c8}
.live[data-frame="frame-minimal"]::after{border-width:2px;border-color:rgba(255,255,255,.92)}
.live[data-frame="frame-vintage"]::after{border-width:7px;border-color:#795b3d;box-shadow:inset 0 0 0 2px #c8a578}
.live[data-frame="frame-pink"]::after{border-color:#ee6f9b}
.live[data-frame="frame-blue"]::after{border-color:#4e82c4}
.live[data-frame="frame-none"]::after{border-color:transparent;box-shadow:none}
.rail[data-kind="frame"] .thumb{background:#ddd}
.rail[data-kind="frame"] .tone-0{border:5px solid #fff;background:#b9c8c3}
.rail[data-kind="frame"] .tone-1{border:5px solid #171717;background:#b9c8c3}
.rail[data-kind="frame"] .tone-2{border:5px double #c79a3b;background:#b9c8c3}
.rail[data-kind="frame"] .tone-3{border:5px dashed #171717;background:#b9c8c3}
.rail[data-kind="frame"] .tone-4{border:5px solid #e9b8c8;background:#b9c8c3}
.rail[data-kind="frame"] .tone-5{border:2px solid #fff;background:#b9c8c3}
.rail[data-kind="frame"] .tone-6{border:6px double #795b3d;background:#b9c8c3}
.rail[data-kind="frame"] .tone-7{border:5px solid #ee6f9b;background:#b9c8c3}
.rail[data-kind="frame"] .tone-8{border:5px solid #4e82c4;background:#b9c8c3}
.rail[data-kind="frame"] .tone-9{border:1px dashed #aaa;background:repeating-linear-gradient(45deg,#eee 0 4px,#ddd 4px 8px)}
/* 프레임은 라이브 테두리가 아니라 AI 결과 1~2장 외부와 사진 사이를 채우는 인화 배경 */
.live::after{display:none}
.rail[data-kind="frame"] .thumb.frame-preview{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,1fr);width:100%;height:auto!important;aspect-ratio:6/4;gap:2px;padding:4px;border:0!important;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(35,35,35,.12)}
.frame-photo{display:block;min-width:0;min-height:0;border-radius:1px;background:linear-gradient(145deg,#8fa9a1,#d6c8b8 48%,#657d88 49%,#b7a28f)}
.rail[data-kind="frame"] .tone-0{background:#fff}
.rail[data-kind="frame"] .tone-1{background:#171717}
.rail[data-kind="frame"] .tone-2{background:linear-gradient(135deg,#9b6c18,#f0d98b 48%,#b78729)}
.rail[data-kind="frame"] .tone-3{background:repeating-linear-gradient(90deg,#111 0 5px,#333 5px 7px)}
.rail[data-kind="frame"] .tone-4{background:linear-gradient(135deg,#f3cad7,#c9dff3)}
.rail[data-kind="frame"] .tone-5{padding:2px;gap:1px;background:#f7f5ef}
.rail[data-kind="frame"] .tone-6{background:repeating-linear-gradient(45deg,#6f4d30 0 5px,#a9845f 5px 10px)}
.rail[data-kind="frame"] .tone-7{background:#ee6f9b}
.rail[data-kind="frame"] .tone-8{background:#4e82c4}
.rail[data-kind="frame"] .tone-9{padding:0;gap:1px;background:#d8d8d8}
/* 라이브에는 카메라 테두리 대신 작은 AI 결과 1~2장 인화 미리보기로 표시 */
.live-frame-preview{position:absolute;z-index:4;left:calc(9.7% + 9px);top:39px;width:62px;height:auto;aspect-ratio:6/4;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,1fr);gap:3px;padding:5px;border:1px solid rgba(255,255,255,.6);border-radius:7px;background:#fff;box-shadow:0 5px 14px rgba(0,0,0,.2);transition:background .3s ease,padding .3s ease,gap .3s ease}
.live-frame-preview::before{content:"AI 1–2장";position:absolute;left:0;top:-12px;padding:2px 5px;border-radius:4px;background:rgba(27,30,28,.62);color:#fff;font-size:6px;font-weight:800;white-space:nowrap}
.live-frame-preview .frame-photo{border-radius:1px;background:linear-gradient(145deg,#78968d,#d7c5ad 48%,#526e7c 49%,#b49b83)}
.live-frame-preview.frame-black{background:#171717}
.live-frame-preview.frame-gold{background:linear-gradient(135deg,#9b6c18,#f0d98b 48%,#b78729)}
.live-frame-preview.frame-film{background:repeating-linear-gradient(90deg,#111 0 5px,#333 5px 7px)}
.live-frame-preview.frame-pastel{background:linear-gradient(135deg,#f3cad7,#c9dff3)}
.live-frame-preview.frame-minimal{padding:2px;gap:1px;background:#f7f5ef}
.live-frame-preview.frame-vintage{background:repeating-linear-gradient(45deg,#6f4d30 0 5px,#a9845f 5px 10px)}
.live-frame-preview.frame-pink{background:#ee6f9b}
.live-frame-preview.frame-blue{background:#4e82c4}
.live-frame-preview.frame-none{padding:0;gap:1px;background:#d8d8d8}
.frame-preview.is-one,.live-frame-preview.is-one{grid-template-columns:1fr;grid-template-rows:1fr}
.frame-preview.is-one .frame-photo:last-child,.live-frame-preview.is-one .frame-photo:last-child{display:none}
.count-toggle{display:flex;gap:2px;margin-left:auto}
.count-toggle button{height:13px;padding:0 5px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font-size:6px;font-weight:800;cursor:pointer}
.count-toggle button.is-active{border-color:var(--key);background:var(--key);color:#fff}
.rail[data-kind="frame"] .rail-current{max-width:30%}
/* 선택 프레임을 라이브 위에 1장/2장 인화 레이아웃으로 직접 오버레이 */
.live-frame-preview{--frame-fill:#fff;z-index:2;left:50%;right:auto;top:0;bottom:auto;width:auto;height:100%;aspect-ratio:6/4;display:block;padding:0!important;gap:0!important;transform:translateX(-50%);border:12px solid var(--frame-fill);border-radius:0;background:transparent!important;box-shadow:none;pointer-events:none}
.live-frame-preview::before{content:"";position:absolute;left:-1px;right:-1px;top:50%;bottom:auto;width:auto;height:9px;padding:0;transform:translateY(-50%);border-radius:0;background:var(--frame-fill)}
.live-frame-preview::after{content:none}
.live-frame-preview .frame-photo{display:none}
.live-frame-preview.is-one::before{display:none}
.live-frame-preview.frame-black{--frame-fill:#171717}
.live-frame-preview.frame-gold{--frame-fill:#c79a3b}
.live-frame-preview.frame-film{--frame-fill:#171717}
.live-frame-preview.frame-pastel{--frame-fill:#e9b8c8}
.live-frame-preview.frame-minimal{--frame-fill:#f7f5ef;border-width:5px}
.live-frame-preview.frame-vintage{--frame-fill:#795b3d}
.live-frame-preview.frame-pink{--frame-fill:#ee6f9b}
.live-frame-preview.frame-blue{--frame-fill:#4e82c4}
.live-frame-preview.frame-none{--frame-fill:transparent;border-color:transparent}
/* 의상 모델을 확대해 얼굴 가이드와 상반신 위치를 맞춤 */
.person.person-photo{top:-3%;bottom:auto;width:54%;height:132%;background-size:auto 118%;background-position:center top}
.guide{top:8%;width:18%;height:31%;border-radius:50%}
/* 최종안: 라이브 전체 오버레이 대신 왼쪽에 선택 프레임 미리보기만 표시 */
.live-frame-preview{z-index:4;left:calc(9.7% + 9px);right:auto;top:42px;bottom:auto;width:60px;height:auto;aspect-ratio:4/6;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,1fr);padding:5px!important;gap:3px!important;transform:none;border:1px solid rgba(255,255,255,.7);border-radius:7px;background:var(--frame-fill)!important;box-shadow:0 5px 14px rgba(0,0,0,.22);pointer-events:none}
.live-frame-preview::before{content:"선택 프레임";position:absolute;left:0;right:auto;top:-13px;bottom:auto;width:auto;height:auto;padding:2px 5px;transform:none;border-radius:4px;background:rgba(27,30,28,.64);color:#fff;font-size:6px;font-weight:800;white-space:nowrap}
.live-frame-preview .frame-photo{display:block}
.live-frame-preview.is-one{grid-template-rows:1fr}
.live-frame-preview.is-one .frame-photo:last-child{display:none}
.live-frame-preview.frame-none{padding:0!important;gap:1px!important;background:#d8d8d8!important}
/* 9안 · 라이브 강조 + 하단 상태 바 + 단일 확장 탭 */
.head{flex:0 0 5%}
.live{width:138%;align-self:center;aspect-ratio:16/9}
.status-panel{flex:0 0 10%;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--soft)}
.status-person{display:grid;gap:3px;justify-items:start;transition:opacity .2s}
.status-person>span,.status-frame>span{color:var(--muted);font-size:6px;font-weight:800}
.status-panel:not(.person-mode) .status-person{opacity:.58}
.status-panel.person-mode .status-person>span{color:var(--key)}
.status-panel .live-people{position:static;display:flex;gap:4px;padding:0;transform:none;border:0;border-radius:0;background:transparent;backdrop-filter:none}
.status-panel .live-people::before{content:none}
.status-panel .live-people .person-shot{width:27px;height:31px;border-color:#bdb5aa;box-shadow:none}
.status-panel .live-people .person-shot::before{top:5px;width:10px;height:10px}
.status-panel .live-people .person-shot::after{width:21px;height:15px}
.status-panel .live-text{position:static;display:flex;flex-wrap:nowrap;align-items:center;gap:4px;max-width:none;overflow-x:auto;color:var(--ink);font-size:7px;scrollbar-width:none}
.status-panel .live-text::-webkit-scrollbar{display:none}
.status-panel .live-text span{flex:0 0 auto;padding:4px 6px;border:1px solid var(--line);background:rgba(255,255,255,.78);color:var(--ink);backdrop-filter:none}
.status-frame{display:grid;gap:3px;justify-items:end}
.status-panel .live-frame-preview{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:28px;height:auto;aspect-ratio:4/6;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,1fr);padding:3px!important;gap:2px!important;transform:none;border:1px solid #bab2a7;border-radius:4px;background:var(--frame-fill)!important;box-shadow:none}
.status-panel .live-frame-preview::before{content:none}
.status-panel .live-frame-preview .frame-photo{display:block}
.setting-tabs{flex:0 0 8%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 9px;border-bottom:1px solid var(--line);background:var(--paper)}
.setting-tab{display:grid;place-items:center;align-content:center;gap:2px;min-width:0;padding:3px 2px;border:1px solid var(--line);border-radius:7px;background:var(--soft);cursor:pointer}
.setting-tab span{font-size:8px;font-weight:850}
.setting-tab small{max-width:100%;overflow:hidden;color:var(--muted);font-size:6px;text-overflow:ellipsis;white-space:nowrap}
.setting-tab.is-active{border-color:var(--key);background:var(--key);color:#fff}
.setting-tab.is-active small{color:rgba(255,255,255,.78)}
.menus{flex:1 1 auto;display:block;min-height:0;padding:5px 10px 8px}
.menus .rail{display:none;height:100%;padding:0;border:0}
.menus .rail.is-active{display:block}
.menus .rail-head{height:18px;padding:0 3px 4px;font-size:9px}
.menus .flow{height:calc(100% - 18px)}
.menus .flow-card{width:auto;height:min(110px,calc(100% - 6px));max-height:none;padding:5px}
.menus .flow-card strong{font-size:8px}
.menus .thumb{height:calc(100% - 14px)}
.menus .rail[data-kind="frame"] .thumb.frame-preview{height:auto!important}
/* 긴 상태값과 버튼명이 잘리지 않도록 2줄까지 자연스럽게 표시 */
.status-panel{flex-basis:12%;padding-top:7px;padding-bottom:7px}
.status-panel .live-text{display:flex;flex-wrap:wrap;align-content:center;overflow:visible;row-gap:4px;line-height:1.15}
.status-panel .live-text span{white-space:normal;overflow:visible;text-overflow:clip}
.setting-tab{overflow:visible}
.setting-tab small{max-width:100%;overflow:visible;text-overflow:clip;white-space:normal;word-break:keep-all;line-height:1.1;text-align:center}
.menus .rail-head{height:24px;align-items:center}
.menus .flow{height:calc(100% - 24px)}
.menus .rail-current,.menus .rail[data-kind="outfit"] .rail-current,.menus .rail[data-kind="face"] .rail-current,.menus .rail[data-kind="frame"] .rail-current{max-width:55%;overflow:visible;text-overflow:clip;white-space:normal;word-break:keep-all;line-height:1.1;text-align:right}
.menus .flow-card strong{overflow:visible;text-overflow:clip;white-space:normal;word-break:keep-all;line-height:1.05}
.menus .thumb{height:calc(100% - 20px)}
/* 탭 선택 후 펼쳐지는 커버 플로우 영역을 압축하고 라이브를 확대 */
.live{width:146%}
.menus{flex:0 0 20%;padding-top:3px;padding-bottom:5px}
.menus .flow-card{height:min(94px,calc(100% - 6px))}
/* 인물별 현재 의상을 크게 확인하는 선택 카드 */
.live{width:142%}
.status-panel{flex-basis:14%;grid-template-columns:auto minmax(0,1fr) auto}
.status-person>span{font-size:7px}
.status-panel .live-people{gap:5px}
.status-panel .live-people .person-shot{width:43px;height:52px;border-radius:7px}
.status-panel .live-people .person-shot::before{top:5px;width:13px;height:13px}
.status-panel .live-people .person-shot::after{bottom:9px;width:31px;height:23px}
.person-shot .person-outfit{position:absolute;z-index:3;left:2px;right:2px;bottom:2px;overflow:hidden;padding:2px 1px;border-radius:3px;background:rgba(255,255,255,.9);color:#2d3430;font-size:5px;font-style:normal;line-height:1.05;text-align:center;text-overflow:ellipsis;white-space:nowrap}
.status-panel .live-people .person-shot span{top:2px;right:2px;bottom:auto;width:12px;height:12px}
/* 라이브 좌우 크롭 제거: 화면 폭 안에서 온전한 16:9 유지 */
.live{width:100%;align-self:center;aspect-ratio:16/9}
.live-badge{left:9px}
.done{right:9px}
.status-panel{flex-basis:18%}
.setting-tabs{flex-basis:9%}
.menus{flex:1 1 auto}
.menus .rail.is-active{height:78%}
</style>
</head>
<body>
<main class="booth" id="booth">
  <section class="live theme-studio" id="live" aria-label="라이브 카메라 화면">
    <span class="live-badge">● LIVE</span><div class="person outfit-casual" id="person"></div><div class="guide"></div><button class="done" type="button">설정 완료</button>
  </section>
  <section class="status-panel" id="statusPanel"><div class="status-person"><span>인물 선택</span><div class="live-people" id="livePeople" aria-label="설정할 인물 선택"></div></div><div class="live-text"><span id="themeText">#배경_스튜디오</span><span id="personText">#인물1</span><span id="outfitText">#의상_캐주얼</span><span id="faceText">#보정_자연스럽게</span><span id="artText">#화풍_기본</span><span id="frameText">#프레임_화이트</span></div><div class="status-frame"><span>프레임</span><div class="live-frame-preview frame-white" id="framePreview" aria-label="선택한 AI 사진 1~2장 프레임 미리보기"><i class="frame-photo"></i><i class="frame-photo"></i></div></div></section>
  <nav class="setting-tabs" aria-label="설정 메뉴"><button type="button" class="setting-tab is-active" data-tab="theme"><span>배경</span><small>아이돌 서재</small></button><button type="button" class="setting-tab" data-tab="art"><span>화풍</span><small>기본</small></button><button type="button" class="setting-tab" data-tab="outfit"><span>의상</span><small>여성 한복</small></button><button type="button" class="setting-tab" data-tab="face"><span>얼굴</span><small>자연스럽게</small></button><button type="button" class="setting-tab" data-tab="frame"><span>프레임</span><small>화이트</small></button></nav>
  <div class="menus">
    <section class="rail is-active" data-kind="theme"><div class="rail-head"><strong>배경 테마</strong><span class="rail-current">스튜디오</span></div><div class="flow"></div></section>
    <section class="rail" data-kind="art"><div class="rail-head"><strong>화풍</strong><span class="rail-current">기본</span></div><div class="flow"></div></section>
    <section class="rail" data-kind="outfit"><div class="rail-head"><strong>의상 스타일 <span class="rail-scope">· 인물 1</span></strong><span class="rail-current">캐주얼</span></div><div class="flow"></div></section>
    <section class="rail" data-kind="face"><div class="rail-head"><strong>얼굴 보정 <span class="rail-scope">· 인물 1</span></strong><span class="rail-current">자연스럽게</span></div><div class="flow"></div></section>
    <section class="rail" data-kind="frame"><div class="rail-head"><strong>사진 프레임</strong><div class="count-toggle" aria-label="프레임에 배치할 사진 수"><button type="button" data-count="1">1장</button><button type="button" class="is-active" data-count="2">2장</button></div><span class="rail-current">화이트</span></div><div class="flow"></div></section>
  </div>
</main>
<script>
(()=>{
  const data={
    theme:[
      ['아이돌 그룹 서재','theme-studio','assets/backgrounds/idol-library.png'],
      ['첨성대','theme-studio','assets/backgrounds/cheomseongdae.png'],
      ['경복궁','theme-studio','assets/backgrounds/gyeongbokgung.png'],
      ['레트로','theme-retro'],['한옥','theme-hanok'],['해변','theme-beach'],['네온 시티','theme-neon'],['설원','theme-snow'],['유럽 거리','theme-europe'],['꽃 정원','theme-garden']
    ],
    outfit:[
      ['여성 한복 네이비','outfit-hanbok','assets/costumes/female-navy.png'],
      ['남성 한복 와인','outfit-hanbok','assets/costumes/male-wine.png'],
      ['여성 한복 블루','outfit-hanbok','assets/costumes/female-blue.png'],
      ['남성 한복 네이비','outfit-hanbok','assets/costumes/male-navy.png'],
      ['데님','outfit-denim'],['스포츠','outfit-sports'],['드레스','outfit-dress'],['교복','outfit-school'],['우주복','outfit-space'],['빈티지','outfit-vintage']
    ],
    face:[['자연스럽게',''],['화사하게',''],['선명하게',''],['부드럽게',''],['잡티 완화',''],['윤곽 보정',''],['눈 강조',''],['피부톤 정리',''],['흑백 보정',''],['보정 없음','']],
    art:[['기본',''],['팝아트',''],['유화',''],['애니메이션',''],['수채화',''],['수묵화',''],['필름',''],['코믹북',''],['석판화',''],['목판화','']],
    frame:[['화이트','frame-white'],['블랙','frame-black'],['골드','frame-gold'],['필름','frame-film'],['파스텔','frame-pastel'],['미니멀','frame-minimal'],['빈티지','frame-vintage'],['핑크','frame-pink'],['블루','frame-blue'],['프레임 없음','frame-none']]
  };
  const people=['인물 1','인물 2','인물 3'];
  const index={theme:0,art:0,frame:0};
  const personSettings=people.map(()=>({outfit:0,face:0}));
  let activePerson=0,outputCount=2,activeKind='theme';
  const live=document.querySelector('#live'),person=document.querySelector('#person'),framePreview=document.querySelector('#framePreview'),statusPanel=document.querySelector('#statusPanel'),themeText=document.querySelector('#themeText'),personText=document.querySelector('#personText'),outfitText=document.querySelector('#outfitText'),faceText=document.querySelector('#faceText'),artText=document.querySelector('#artText'),frameText=document.querySelector('#frameText');
  function selectedIndex(kind){return kind==='outfit'||kind==='face'?personSettings[activePerson][kind]:index[kind]}
  function selectedLabel(kind){return data[kind][selectedIndex(kind)][0]}
  function updateLive(){
    const themeItem=data.theme[selectedIndex('theme')],outfitItem=data.outfit[selectedIndex('outfit')];
    live.className=`live ${themeItem[1]}`;
    live.style.backgroundImage=themeItem[2]?`url("${encodeURI(themeItem[2])}")`:'';
    live.style.backgroundSize=themeItem[2]?'cover':'';
    live.style.backgroundPosition=themeItem[2]?'center':'';
    person.className=outfitItem[2]?'person person-photo':`person ${outfitItem[1]}`;
    person.style.backgroundImage=outfitItem[2]?`url("${encodeURI(outfitItem[2])}")`:'';
    framePreview.className=`live-frame-preview ${data.frame[selectedIndex('frame')][1]}${outputCount===1?' is-one':''}`;
    themeText.textContent=`#배경_${selectedLabel('theme').replaceAll(' ','')}`;
    personText.textContent=`#${people[activePerson].replaceAll(' ','')}`;
    outfitText.textContent=`#의상_${selectedLabel('outfit').replaceAll(' ','')}`;
    faceText.textContent=`#보정_${selectedLabel('face').replaceAll(' ','')}`;
    artText.textContent=`#화풍_${selectedLabel('art').replaceAll(' ','')}`;
    frameText.textContent=`#프레임_${selectedLabel('frame').replaceAll(' ','')}_${outputCount}장`;
    ['theme','art','outfit','face','frame'].forEach(kind=>{const value=document.querySelector(`.setting-tab[data-tab="${kind}"] small`);if(value)value.textContent=selectedLabel(kind)});
  }
  function syncPeople(){document.querySelectorAll('.person-shot').forEach(button=>{const personIndex=Number(button.dataset.person),active=personIndex===activePerson,outfitName=data.outfit[personSettings[personIndex].outfit][0];button.classList.toggle('is-active',active);button.setAttribute('aria-pressed',String(active));button.setAttribute('aria-label',`${people[personIndex]}, 의상 ${outfitName}`);const outfitLabel=button.querySelector('.person-outfit');if(outfitLabel)outfitLabel.textContent=outfitName});document.querySelectorAll('.rail-scope').forEach(label=>label.textContent=`· ${people[activePerson]}`)}
  function selectPerson(personIndex){activePerson=personIndex;syncPeople();draw('outfit');draw('face');updateLive()}
  function setOutputCount(count){outputCount=count;document.querySelectorAll('.count-toggle button').forEach(button=>button.classList.toggle('is-active',Number(button.dataset.count)===count));document.querySelectorAll('.frame-preview').forEach(preview=>preview.classList.toggle('is-one',count===1));updateLive()}
  function setActiveTab(kind){activeKind=kind;document.querySelectorAll('.setting-tab').forEach(button=>button.classList.toggle('is-active',button.dataset.tab===kind));document.querySelectorAll('.rail').forEach(rail=>rail.classList.toggle('is-active',rail.dataset.kind===kind));statusPanel.classList.toggle('person-mode',kind==='outfit'||kind==='face');draw(kind)}
  function draw(kind){
    const rail=document.querySelector(`.rail[data-kind="${kind}"]`),cards=[...rail.querySelectorAll('.flow-card')],count=data[kind].length;
    cards.forEach((card,i)=>{
      let offset=(i-selectedIndex(kind)+count)%count;
      if(offset>count/2)offset-=count;
      const distance=Math.abs(offset),visible=distance<=3;
      const x=offset*60,scale=distance===0?1:distance===1?0.9:distance===2?0.8:0.7,rotate=offset<0?28:offset>0?-28:0;
      card.classList.toggle('is-visible',visible);card.classList.toggle('is-center',offset===0);card.classList.toggle('is-side',distance===1);card.classList.toggle('is-far',distance===2);card.classList.toggle('is-edge',distance===3);card.classList.toggle('is-right',offset>0);
      card.style.transform=`translateX(calc(-50% + ${x}%)) translateY(-50%) translateZ(${offset===0?20:-35}px) rotateY(${rotate}deg) scale(${scale})`;
      card.style.zIndex=String(20-Math.abs(offset));
    });
    rail.querySelector('.rail-current').textContent=selectedLabel(kind);updateLive();
  }
  function build(kind){
    const flow=document.querySelector(`.rail[data-kind="${kind}"] .flow`);
    data[kind].forEach(([label,,image],i)=>{const card=document.createElement('button');card.type='button';card.className='flow-card';const imageStyle=image?` style="background-image:url('${encodeURI(image)}')"`:'';const thumb=kind==='frame'?`<span class="thumb tone-${i} frame-preview"><i class="frame-photo"></i><i class="frame-photo"></i></span>`:`<span class="thumb tone-${i}${image?' has-image':''}"${imageStyle}></span>`;card.innerHTML=`${thumb}<strong>${label}</strong>`;card.onclick=()=>{if(kind==='outfit'||kind==='face'){personSettings[activePerson][kind]=i;syncPeople()}else index[kind]=i;draw(kind)};flow.appendChild(card)});draw(kind);
  }
  people.forEach((name,i)=>{const button=document.createElement('button');button.type='button';button.className='person-shot';button.dataset.person=i;button.title=name;button.setAttribute('aria-label',name);button.innerHTML=`<span>${i+1}</span><b class="person-outfit">${data.outfit[personSettings[i].outfit][0]}</b>`;button.onclick=()=>selectPerson(i);document.querySelector('#livePeople').appendChild(button)});
  ['theme','art','outfit','face','frame'].forEach(build);
  document.querySelectorAll('.setting-tab').forEach(button=>button.onclick=()=>setActiveTab(button.dataset.tab));
  document.querySelectorAll('.count-toggle button').forEach(button=>button.onclick=()=>setOutputCount(Number(button.dataset.count)));
  syncPeople();
  setActiveTab('theme');
  document.querySelector('.done').onclick=e=>{e.currentTarget.textContent='완료됨'};
})();
</script>
</body>
</html>
