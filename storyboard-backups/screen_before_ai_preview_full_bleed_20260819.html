<style>
:root{--ink:#14221c;--muted:#6e756f;--paper:#fbfaf6;--green:#153f33;--mint:#d9e8df;--orange:#d47742;--line:#ddd9cf;--shadow:0 22px 70px rgba(17,30,24,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d9ddd8;font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--ink)}
body{display:grid;place-items:center;padding:12px}.kiosk{position:relative;width:min(100%,640px);aspect-ratio:4/6;overflow:hidden;border:1px solid #c9cec8;border-radius:28px;background:var(--paper);box-shadow:var(--shadow)}
.body{height:100%;padding:6% 5% 15%;display:flex;flex-direction:column;gap:3%}.body.no-action{padding-bottom:6%}.foot{display:none;position:absolute;z-index:10;left:50%;bottom:3.2%;height:auto;transform:translateX(-50%);background:transparent}.next{min-width:132px;border:0;border-radius:999px;background:var(--green);color:#fff;padding:12px 22px;font-weight:850;box-shadow:0 10px 28px rgba(23,76,60,.28);cursor:pointer}
.eyebrow{margin:0;color:var(--orange);font-size:10px;font-weight:900;letter-spacing:.14em}.title{margin:0;font:800 clamp(25px,5vw,38px)/1.05 Georgia,"Noto Serif KR",serif;letter-spacing:-.04em}.lead{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.hero{position:relative;min-height:0;flex:1;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#183d34,#356f5c);color:#fff}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.72))}.hero-copy{position:absolute;z-index:2;left:6%;right:6%;bottom:6%}.hero-copy strong{display:block;font:800 26px Georgia,serif}.hero-copy span{font-size:11px;opacity:.85}.pulse{position:absolute;z-index:3;right:5%;top:5%;width:12px;height:12px;border-radius:50%;background:#ff7657;box-shadow:0 0 0 6px rgba(255,118,87,.25)}
.grid{display:grid;gap:9px}.grid.two{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}.tile{position:relative;min-height:74px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px;text-align:left}.tile strong{display:block;font-size:13px}.tile small{display:block;margin-top:5px;color:var(--muted);font-size:9px;line-height:1.4}.tile.selected{border:2px solid var(--green);background:#edf5f0}.tile.selected:after{content:'✓';position:absolute;right:10px;top:8px;color:var(--green);font-weight:900}
.notice{display:grid;gap:10px}.note{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}.note b{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:50%;background:var(--mint);color:var(--green)}.note strong{font-size:12px}.note p{margin:4px 0 0;color:var(--muted);font-size:9px;line-height:1.5}.lang-return{position:absolute;z-index:12;top:4%;right:5%;display:grid;grid-template-columns:15px 24px auto;align-items:center;gap:5px;border:1px solid rgba(21,63,51,.3);border-radius:999px;background:rgba(255,255,255,.94);color:var(--green);padding:7px 10px 7px 8px;box-shadow:0 8px 22px rgba(20,34,28,.15);backdrop-filter:blur(8px);cursor:pointer}.lang-return .back-arrow{font-size:17px;font-weight:900;line-height:1}.lang-return svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}.lang-return small{font-size:9px;font-weight:900;letter-spacing:.08em}
.amount{padding:16px;border-radius:18px;background:#102d25;color:#fff}.amount small{display:block;opacity:.7}.amount strong{display:block;margin-top:5px;font:800 24px Georgia,serif}.pay{height:96px}.pay i{display:block;width:28px;height:20px;margin-bottom:12px;border-radius:4px;background:linear-gradient(135deg,#e9d090,#8f6c2f)}.body.mode-mode{padding:6% 5%}.mode-options{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:11px;min-height:0;flex:1}.mode-card{position:relative;min-width:0;overflow:hidden;border:2px solid transparent;border-radius:20px;background:#182720;color:#fff;padding:0;box-shadow:0 14px 30px rgba(18,31,25,.18);cursor:pointer;text-align:left;transition:.2s}.mode-card:hover,.mode-card.selected{transform:translateY(-4px);border-color:#fff;box-shadow:0 0 0 4px var(--green),0 18px 34px rgba(18,31,25,.24)}.mode-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mode-card:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.12) 42%,rgba(5,16,12,.86))}.mode-copy{position:absolute;z-index:2;left:45%;right:18px;bottom:50%;transform:translateY(50%)}.mode-copy em{display:block;margin-bottom:6px;color:#f1b783;font-size:8px;font-style:normal;font-weight:900;letter-spacing:.12em}.mode-copy strong{display:block;font:800 20px/1.15 Georgia,"Noto Serif KR",serif}.mode-copy span{display:block;margin-top:7px;color:rgba(255,255,255,.78);font-size:9px;line-height:1.45}.fourcut-grid{position:absolute;z-index:2;top:12px;left:12px;display:grid;grid-template-columns:repeat(2,17px);grid-template-rows:repeat(2,22px);gap:3px;padding:5px;border-radius:8px;background:rgba(255,255,255,.88);box-shadow:0 6px 16px rgba(0,0,0,.18)}.fourcut-grid i{border-radius:2px;background:linear-gradient(145deg,#81998d,#d5b692)}.body.payment-mode{padding:6% 5%}.body.payment-mode .amount{padding:20px;border-radius:20px}.body.payment-mode .amount strong{font-size:30px}.body.payment-mode .grid{grid-template-rows:repeat(2,minmax(0,1fr));min-height:0;flex:1}.body.payment-mode .tile{height:100%;min-height:0;padding:18px}.body.payment-mode .tile strong{font-size:15px}.body.payment-mode .tile small{font-size:10px}
.camera{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:#17221e url('../assets/backgrounds/gyeongbokgung.png') center/cover}.camera:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(0,0,0,.72))}.camera.normal{background-image:linear-gradient(135deg,#4f625b,#1d2a25)}.counter{position:absolute;z-index:2;inset:0;display:grid;place-items:center;color:#fff;font:900 70px Georgia,serif;text-shadow:0 6px 24px #000}.cut{position:absolute;z-index:3;top:15px;left:15px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;font-weight:900}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:56px}.thumb{position:relative;border-radius:8px;background:linear-gradient(135deg,#b7c5bd,#778a7e);overflow:hidden}.thumb:nth-child(2n){background:linear-gradient(135deg,#e8d1b2,#aa7757)}.thumb b{position:absolute;right:5px;bottom:4px;color:#fff;font-size:9px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-height:0;flex:1}.photo{position:relative;border-radius:14px;background:linear-gradient(145deg,#d6ddd7,#768c80);overflow:hidden}.photo:nth-child(2){background:linear-gradient(145deg,#e0cbb8,#8f6754)}.photo:nth-child(3){background:linear-gradient(145deg,#c8d5df,#6d7f91)}.photo:nth-child(4){background:linear-gradient(145deg,#ded5bf,#83785f)}.photo.selected{outline:4px solid var(--orange);outline-offset:-4px}.photo b{position:absolute;top:8px;left:8px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--ink);font-size:10px}.photo.selected b{background:var(--orange);color:#fff}
.progress{position:relative;display:grid;place-items:center;flex:1;border-radius:22px;background:radial-gradient(circle at 50% 35%,#497c6a,#183c31);color:#fff;text-align:center}.ring{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:conic-gradient(#f2a668 0 68%,rgba(255,255,255,.18) 68%);box-shadow:inset 0 0 0 14px rgba(17,47,38,.7)}.ring strong{display:grid;place-items:center;width:112px;height:112px;border-radius:50%;background:#183c31;font:800 29px Georgia,serif}.progress p{position:absolute;bottom:12%;margin:0;font-size:11px}
.result-photo{flex:1;min-height:0;border-radius:21px;background:url('../assets/backgrounds/idol-library.png') center/cover;box-shadow:inset 0 -90px 80px rgba(0,0,0,.38)}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice-row button{border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px;font-weight:800}.choice-row button:first-child{background:var(--green);color:#fff}
.sheet-wrap{display:grid;grid-template-columns:42% 1fr;gap:12px;min-height:0;flex:1}.sheet{aspect-ratio:6/4;align-self:center;padding:9px;border-radius:6px;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.16)}.sheet.vertical{aspect-ratio:4/6}.sheet-grid{display:grid;width:100%;height:100%;gap:5px}.sheet-grid.two{grid-template-rows:1fr 1fr}.sheet-grid.four{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.slot-photo{border-radius:3px;background:linear-gradient(135deg,#aebeb6,#527263)}.slot-photo:nth-child(2){background:linear-gradient(135deg,#d7c0aa,#976b51)}.slot-photo:nth-child(3){background:linear-gradient(135deg,#c0cddd,#64758a)}.slot-photo:nth-child(4){background:linear-gradient(135deg,#d9ceb6,#88795b)}.settings{display:grid;align-content:center;gap:8px}.pill{padding:10px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:10px;font-weight:800}.pill.active{background:var(--green);color:#fff}
.sticker-stage{position:relative;flex:1;border-radius:22px;background:linear-gradient(145deg,#c8d7cf,#527061);overflow:hidden}.sticker{position:absolute;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#ffe780;border:3px solid #fff;font-size:29px;box-shadow:0 8px 18px rgba(0,0,0,.2)}.sticker.a{left:20%;top:20%;transform:rotate(-12deg)}.sticker.b{right:18%;bottom:18%;transform:rotate(16deg)}.tools{display:flex;gap:7px;overflow:hidden}.tools span{flex:0 0 52px;height:52px;display:grid;place-items:center;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:23px}
.pickup{display:grid;place-items:center;flex:1;border-radius:22px;background:#153f33;color:#fff;text-align:center}.pickup .icon{font-size:64px}.pickup strong{display:block;font:800 30px Georgia,serif}.pickup p{font-size:11px;line-height:1.6}.qr{width:116px;height:116px;margin:auto;background:repeating-conic-gradient(#15231d 0 25%,#fff 0 50%) 0/18px 18px;border:8px solid #fff}.goodbye{display:grid;place-items:center;flex:1;text-align:center}.goodbye .mark{display:grid;place-items:center;width:110px;height:110px;border-radius:50%;background:var(--mint);color:var(--green);font-size:45px}.goodbye h2{font:800 35px Georgia,serif}.goodbye p{color:var(--muted);font-size:11px;line-height:1.7}.body.welcome-mode{padding:0;gap:0}.promo-full{position:absolute;inset:0;overflow:hidden;background:#17231f}.promo-full>img{width:100%;height:100%;object-fit:cover}.promo-full:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.1) 36%,rgba(0,0,0,.78))}.language-float{position:absolute;z-index:3;left:6%;right:6%;bottom:5%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.language-start{border:1px solid rgba(255,255,255,.6);border-radius:999px;background:rgba(16,35,28,.7);color:#fff;padding:12px 9px;box-shadow:0 12px 28px rgba(0,0,0,.3);backdrop-filter:blur(10px);text-align:center;cursor:pointer}.language-start strong{display:block;font-size:13px}
/* 세로 키오스크에 가로 참고 화면의 정보 구조를 재배치한 평면형 UI */
.kiosk{border-radius:0;border:7px solid #292825;box-shadow:none}
.body{padding-top:7%;background:linear-gradient(180deg,#fffdf9 0 18%,#f7f2eb 18% 100%)}
.hero,.tile,.note,.amount,.mode-card,.camera,.thumb,.photo,.progress,.result-photo,.choice-row button,.sheet,.pill,.sticker-stage,.tools span,.pickup,.language-start,.lang-return,.next{border-radius:0}
.title{padding-bottom:3%;border-bottom:1px solid #d8d1c7}
.lead{max-width:90%}
.mode-options{gap:1px;border:1px solid var(--line)}
.mode-card{border:0;border-bottom:1px solid rgba(255,255,255,.45);box-shadow:none}
.mode-card:hover,.mode-card.selected{transform:none;border-color:#fff;box-shadow:inset 8px 0 0 var(--green)}
.body.payment-mode .amount{border-radius:0;border-left:9px solid #d47742}
.body.payment-mode .grid{gap:1px;border:1px solid var(--line)}
.camera,.result-photo,.sticker-stage,.pickup{border:1px solid #343633}
.photo-grid,.thumbs,.choice-row{gap:2px}
.sheet{box-shadow:0 0 0 1px #aaa}
/* 실제 키오스크 화면: 외곽 액자와 주변 여백 제거 */
html,body{width:100%;height:100%;min-height:0;background:transparent}
body{padding:0}
.kiosk{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
/* 화면 내부 조작 요소에만 라운드를 사용 */
.hero{border-radius:20px}
.tile,.note,.amount,.mode-card,.camera,.photo,.progress,.result-photo,.sheet,.sticker-stage,.pickup{border-radius:14px}
.choice-row button,.tools span,.lang-return{border-radius:10px}
.thumb{border-radius:7px}
.pill,.language-start,.next{border-radius:999px}
.goodbye>div{width:100%;height:100%;display:grid;place-items:center;align-content:center;justify-items:center}
.goodbye .mark{margin:0 auto;line-height:1}
/* 실제 서비스용 키오스크 UI 디자인 시스템 */
:root{
  --ink:#10223b;
  --muted:#66778b;
  --paper:#f8fcfd;
  --green:#22bfa5;
  --mint:#dff8f3;
  --orange:#ff718d;
  --blue:#249df0;
  --blue-deep:#10243f;
  --sky:#e4f6fb;
  --pink:#ffe6ec;
  --lavender:#eceaff;
  --line:#dce8ec;
  --shadow:0 22px 55px rgba(33,79,111,.16);
}
html,body{background:transparent;color:var(--ink)}
.kiosk{background:#f7fbfc}
.body{
  position:relative;
  isolation:isolate;
  gap:2.4%;
  padding:6.2% 5.2% 14%;
  overflow:hidden;
  background:
    radial-gradient(circle at 100% 0,rgba(255,113,141,.17),transparent 27%),
    radial-gradient(circle at 0 100%,rgba(63,210,194,.20),transparent 31%),
    linear-gradient(180deg,#fbfeff 0%,#f1f9fb 100%);
}
.body::before,.body::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.body::before{right:-18%;top:-10%;width:55%;aspect-ratio:1;background:rgba(210,242,248,.62)}
.body::after{left:-24%;bottom:-16%;width:64%;aspect-ratio:1;background:rgba(217,248,240,.54)}
.body>*{position:relative;z-index:1}
.body.no-action{padding-bottom:6.2%}
.title{
  margin:0;
  padding:0;
  border:0;
  color:var(--blue-deep);
  font:900 clamp(25px,5vw,38px)/1.08 Inter,Pretendard,"Noto Sans KR",sans-serif;
  letter-spacing:-.06em;
  text-wrap:balance;
}
.lead{max-width:94%;margin:0;color:var(--muted);font-size:11px;font-weight:600;line-height:1.55}
.foot{bottom:3.4%}
.next{
  min-width:150px;
  border-radius:14px;
  background:linear-gradient(135deg,#24a8f3,#397feb);
  padding:13px 24px;
  box-shadow:0 13px 28px rgba(36,139,225,.29);
  font-size:12px;
}
.next::after{content:"  →"}
.grid{gap:10px}
.tile{
  min-height:78px;
  border:1px solid rgba(255,255,255,.95);
  border-radius:18px;
  background:rgba(255,255,255,.90);
  padding:15px;
  box-shadow:0 11px 24px rgba(36,76,104,.10);
  color:var(--ink);
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(36,95,136,.15)}
.tile strong{font-size:13px;font-weight:900;letter-spacing:-.025em}
.tile small{margin-top:6px;color:var(--muted);font-size:9px}
.tile.selected{border:2px solid #4ebaf2;background:#e9f8ff;box-shadow:0 0 0 4px rgba(36,157,240,.12),0 14px 28px rgba(36,120,180,.13)}
.tile.selected:after{right:12px;top:10px;color:var(--blue);font-size:14px}
.notice{gap:10px;margin-top:1%}
.note{
  gap:13px;
  padding:15px;
  border:1px solid rgba(255,255,255,.95);
  border-radius:19px;
  background:rgba(255,255,255,.91);
  box-shadow:0 12px 25px rgba(40,82,110,.09);
}
.note b{flex-basis:32px;height:32px;border-radius:11px;background:var(--sky);color:var(--blue);font-size:11px}
.note strong{color:var(--blue-deep);font-size:12px}
.note p{color:var(--muted);font-size:9px;line-height:1.55}
.lang-return{
  top:3.5%;right:4.6%;
  border:1px solid rgba(70,166,219,.25);
  border-radius:13px;
  background:rgba(255,255,255,.88);
  color:#187db8;
  box-shadow:0 10px 24px rgba(33,92,129,.12);
}
.amount{
  padding:18px;
  border:0;
  border-radius:22px;
  background:linear-gradient(135deg,#1e9ff0,#5a7df0);
  box-shadow:0 17px 36px rgba(41,125,211,.24);
  color:#fff;
}
.amount small{opacity:.84;font-weight:750}
.amount strong{font:900 26px Inter,Pretendard,sans-serif;letter-spacing:-.04em}
.body.payment-mode{padding:6.2% 5.2% 6.2%}
.body.payment-mode .amount{padding:22px;border:0;border-radius:23px}
.body.payment-mode .amount strong{font-size:31px}
.body.payment-mode .grid{gap:10px;border:0}
.body.payment-mode .tile{padding:18px}
.mode-options{gap:12px;border:0}
.mode-card{
  overflow:hidden;
  border:2px solid rgba(255,255,255,.75);
  border-radius:24px;
  box-shadow:0 17px 36px rgba(24,57,83,.18);
}
.mode-card::before{content:"";position:absolute;z-index:2;inset:10px;border:1px solid rgba(255,255,255,.32);border-radius:17px;pointer-events:none}
.mode-card:after{background:linear-gradient(90deg,rgba(10,23,39,.08),rgba(10,23,39,.22) 37%,rgba(8,20,36,.87))}
.mode-card:hover,.mode-card.selected{transform:translateY(-4px);border-color:#fff;box-shadow:0 0 0 5px rgba(36,157,240,.18),0 21px 40px rgba(26,91,139,.25)}
.mode-copy{left:45%;right:20px}
.mode-copy em{color:#7bd7ff;font-size:8px}
.mode-card:nth-child(2) .mode-copy em{color:#ffadbd}
.mode-copy strong{font:900 20px/1.15 Inter,Pretendard,"Noto Sans KR",sans-serif;letter-spacing:-.04em}
.mode-copy span{font-size:9px;line-height:1.5}
.fourcut-grid{top:16px;left:16px;border-radius:12px;background:rgba(255,255,255,.91)}
.camera{
  border:0;
  border-radius:25px;
  box-shadow:0 18px 39px rgba(25,62,88,.18);
}
.camera:after{background:linear-gradient(180deg,rgba(5,15,25,.02) 42%,rgba(6,17,28,.70))}
.camera.normal{background-image:linear-gradient(145deg,#8cd4df,#5f78ad)}
.counter{font:900 76px Inter,sans-serif;text-shadow:0 8px 30px rgba(0,0,0,.45)}
.cut{top:14px;left:14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(13,31,49,.64);backdrop-filter:blur(8px)}
.thumbs{gap:8px;height:58px}
.thumb{border:2px solid rgba(255,255,255,.88);border-radius:13px;box-shadow:0 7px 16px rgba(31,71,99,.12)}
.photo-grid{gap:10px}
.photo{
  border:2px solid rgba(255,255,255,.9);
  border-radius:20px;
  background:linear-gradient(145deg,#dff8f4,#82b7ba);
  box-shadow:0 12px 26px rgba(30,75,105,.11);
}
.photo:nth-child(2){background:linear-gradient(145deg,#ffe8ec,#c78fa6)}
.photo:nth-child(3){background:linear-gradient(145deg,#e5f4ff,#7ea2c9)}
.photo:nth-child(4){background:linear-gradient(145deg,#f0edff,#9289c6)}
.photo.selected{outline:4px solid var(--blue);box-shadow:0 0 0 5px rgba(36,157,240,.13)}
.photo b{top:10px;left:10px;width:28px;height:28px;background:rgba(255,255,255,.92);color:var(--blue);font-size:12px;box-shadow:0 5px 14px rgba(27,71,102,.13)}
.photo.selected b{background:var(--blue);color:#fff}
.selection-status{padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.78);text-align:center}
.progress{
  border:0;
  border-radius:26px;
  background:radial-gradient(circle at 50% 30%,#55d7ca,#278edc 57%,#516ee0);
  box-shadow:0 21px 44px rgba(38,117,188,.25);
}
.ring{width:156px;height:156px;background:conic-gradient(#fff 0 68%,rgba(255,255,255,.20) 68%);box-shadow:inset 0 0 0 14px rgba(41,123,191,.48),0 15px 35px rgba(18,72,129,.24)}
.ring strong{width:116px;height:116px;background:rgba(18,67,125,.62);font:900 28px Inter,sans-serif;backdrop-filter:blur(8px)}
.progress p{bottom:11%;font-weight:750}
.result-photo{border:0;border-radius:25px;box-shadow:inset 0 -90px 80px rgba(7,18,30,.40),0 18px 38px rgba(25,63,90,.18)}
.choice-row{gap:10px}
.choice-row button{border:1px solid #dce8ed;border-radius:15px;background:#fff;padding:14px;color:#40526a;box-shadow:0 9px 20px rgba(39,76,103,.08)}
.choice-row button:first-child{border-color:var(--blue);background:linear-gradient(135deg,#24a8f3,#397feb);color:#fff}

.sheet{padding:10px;border:1px solid rgba(255,255,255,.96);border-radius:12px;box-shadow:0 15px 33px rgba(30,66,91,.17)}

.slot-photo:nth-child(3){background:linear-gradient(135deg,#e4f4ff,#789ac2)}
.slot-photo:nth-child(4){background:linear-gradient(135deg,#eceaff,#8c82c7)}

  border:0;

}

.tools span{border:1px solid rgba(255,255,255,.95);border-radius:15px;background:rgba(255,255,255,.90);box-shadow:0 9px 20px rgba(36,75,103,.09)}

  border:0;
  border-radius:27px;
  background:linear-gradient(145deg,#102b48,#155f86 54%,#25b8a8);
  box-shadow:0 22px 46px rgba(15,67,103,.28);
}

.goodbye>div{max-width:82%;height:auto;padding:12% 8%;border:1px solid rgba(255,255,255,.95);border-radius:28px;background:rgba(255,255,255,.84);box-shadow:0 22px 46px rgba(35,83,112,.12);backdrop-filter:blur(12px)}
.goodbye .mark{width:116px;height:116px;background:linear-gradient(145deg,#d9f8f1,#c9eef9);color:#189f9d;font-size:46px;box-shadow:0 14px 30px rgba(33,156,159,.14)}

.body.welcome-mode{padding:0;background:#10243f}
.promo-full{background:#10243f}
.promo-full:after{background:linear-gradient(180deg,rgba(8,23,39,.04),rgba(8,23,39,.18) 45%,rgba(8,23,39,.88))}
.language-float{left:7%;right:7%;bottom:6%;gap:10px}
.language-start{border:1px solid rgba(255,255,255,.42);border-radius:15px;background:rgba(255,255,255,.14);padding:12px 9px;box-shadow:0 12px 28px rgba(0,0,0,.22);backdrop-filter:blur(16px)}
.language-start strong{font-size:13px}
/* 공통 자식 배치 규칙이 화면 전용 absolute 배치를 덮어쓰지 않도록 복원 */
.body.welcome-mode>.promo-full{
  position:absolute;
  inset:0;
  z-index:1;
  width:100%;
  height:100%;
}
.body.welcome-mode .language-float{
  position:absolute;
  top:auto;
  bottom:6%;
  transition:opacity .34s ease,transform .34s ease;
}
.body.welcome-mode .language-float.is-gated{opacity:0;pointer-events:none;transform:translateY(18px)}
.body.welcome-mode .language-float.is-open{opacity:1;pointer-events:auto;transform:translateY(0)}
.start-invite{position:absolute;z-index:20;inset:0;border:0;background:transparent;color:#fff;cursor:pointer;transition:opacity .28s ease,transform .28s ease}
.start-invite.is-hidden{opacity:0;pointer-events:none;transform:translateY(12px)}
.start-invite span{position:absolute;left:5%;right:5%;bottom:6%;height:74px;display:grid;place-items:center;opacity:0;font-size:34px;font-weight:950;letter-spacing:-.04em;text-shadow:0 3px 18px rgba(0,0,0,.72);animation:startWordCycle 9s infinite}
.start-invite span:nth-child(2){animation-delay:1.5s}.start-invite span:nth-child(3){animation-delay:3s}.start-invite span:nth-child(4){animation-delay:4.5s}.start-invite span:nth-child(5){animation-delay:6s}.start-invite span:nth-child(6){animation-delay:7.5s}
@keyframes startWordCycle{0%,24%,100%{opacity:0;transform:translateY(10px) scale(.96)}5%,16%{opacity:1;transform:translateY(0) scale(1)}}
.body[data-kind="notice"]>.lang-return{
  position:absolute;
  z-index:12;
  top:3.5%;
  right:4.6%;
}
.body[data-kind="notice"]>.title{padding-right:34%}
.body[data-kind="notice"]>.notice{margin-top:2%}
@media(max-width:430px){
  .body{padding-left:5%;padding-right:5%}
  .title{font-size:28px}
  .mode-copy strong{font-size:18px}
}

/* ===== 사람 감지 · 얼굴 촬영 (대기 홍보 화면) ===== */
.campip{position:absolute;z-index:4;right:6%;top:5%;width:38%;aspect-ratio:16/9;overflow:hidden;border:2px solid rgba(255,255,255,.85);border-radius:12px;background:#0b1b2c center/cover no-repeat;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.campip::before{content:"CAM";position:absolute;z-index:3;left:6px;top:5px;padding:2px 6px;border-radius:999px;background:rgba(9,24,40,.7);color:#fff;font-size:7px;font-weight:900;letter-spacing:.08em}
.campip .detbox{position:absolute;border:2px solid #2ee0a8;border-radius:7px;box-shadow:0 0 0 3px rgba(46,224,168,.2);transition:opacity .3s}
.cam-person{position:absolute;bottom:8%;height:78%;width:auto!important;object-fit:contain;filter:drop-shadow(0 4px 7px rgba(6,20,33,.3))}
.campip.no-person .cam-person{opacity:0;transition:opacity .3s}
.campip .detbox u{position:absolute;left:-2px;top:-12px;padding:1px 5px;border-radius:4px;background:#2ee0a8;color:#05261c;font-size:6.5px;font-weight:900;text-decoration:none;white-space:nowrap}
.campip.no-person .detbox{opacity:0}
.campip .noone{position:absolute;z-index:2;inset:0;display:none;place-items:center;background:rgba(9,24,40,.55);color:#ffd08a;font-size:9px;font-weight:900}
.campip.no-person .noone{display:grid}

.detect{grid-column:1/-1;position:relative;z-index:5;display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid rgba(255,255,255,.32);border-radius:16px;background:rgba(9,24,40,.52);backdrop-filter:blur(14px);color:#fff}
.detect .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#2ee0a8;box-shadow:0 0 0 5px rgba(46,224,168,.18);animation:detpulse 1.5s ease-in-out infinite}
.detect.off .dot{background:#ffb648;box-shadow:0 0 0 5px rgba(255,182,72,.18)}
@keyframes detpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
.detect .txt strong{display:block;font-size:11px;font-weight:900;letter-spacing:-.02em}
.detect .txt small{display:block;margin-top:1px;font-size:7.5px;line-height:1.25;opacity:.82}
.detect .txt{min-width:0}
.detect .faces{margin-left:auto;display:flex;gap:4px}
.detect .faces i{position:relative;width:28px;height:28px;overflow:hidden;border:1.5px solid rgba(255,255,255,.85);border-radius:9px;background:rgba(255,255,255,.14)}
.detect .faces i img{position:absolute;left:50%;top:50%;width:190%;transform:translate(-50%,-46%)}
.detect .sim{flex:0 0 auto;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.12);color:#fff;padding:5px 9px;font-size:7.5px;font-weight:900;cursor:pointer}

.detect .faces i.pending{border-style:dashed;opacity:.55}
.detect .faces i.done{animation:facePop .32s ease}
@keyframes facePop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.campip .scan{position:absolute;z-index:4;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#2ee0a8,transparent);box-shadow:0 0 8px #2ee0a8;animation:scanmove 1.6s ease-in-out infinite}
.campip.ready .scan{display:none}
@keyframes scanmove{0%,100%{top:8%}50%{top:88%}}
.toastmsg{position:absolute;z-index:22;left:50%;bottom:15%;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:rgba(255,182,72,.95);color:#3a2400;font-size:10px;font-weight:900;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toastmsg.on{opacity:1}

.flow-next{position:absolute;z-index:15;left:6%;right:6%;bottom:4.5%;border:0;border-radius:15px;background:linear-gradient(135deg,#24a8f3,#3f8bef);color:#fff;padding:14px 16px;font-size:13px;font-weight:900;box-shadow:0 14px 28px rgba(35,126,202,.3);cursor:pointer}
.flow-next:active{transform:translateY(1px)}

/* A05 · B05 — 실제 인화지 비율을 크게 확인한 뒤 아래 사진에서 1~2장 선택 */
.body.result-layout-mode{padding:4.5% 5% 13.5%;gap:1.8%;background:linear-gradient(180deg,#f7fbfd,#eef7f7 58%,#f9fbfb)}
.body.result-layout-mode>.title{font-size:27px}.body.result-layout-mode>.lead{font-size:9px;line-height:1.35}
.print-picker{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;flex:1;min-height:0}
.print-preview-zone{display:grid;place-items:center;min-height:0;padding:8px 10px;border:1px solid rgba(20,66,88,.12);border-radius:19px;background:linear-gradient(145deg,#dbe9ed,#f8fbfb);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.print-sheet{--sheet-frame:#fff;position:relative;display:grid;overflow:hidden;width:min(92%,440px);aspect-ratio:6/4;padding:10px;gap:6px;background:var(--sheet-frame);border:1px solid rgba(14,47,65,.18);box-shadow:0 15px 34px rgba(13,55,79,.21);transition:width .28s ease,aspect-ratio .28s ease,transform .28s ease}
.print-sheet.one{aspect-ratio:6/4;width:min(92%,440px);grid-template-rows:1fr}
.print-sheet.two{aspect-ratio:4/6;width:min(54%,260px);grid-template-rows:1fr 1fr}
.print-sheet.four{aspect-ratio:6/4;width:min(92%,440px);grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px}
.print-sheet.frame-white{--sheet-frame:#fff}.print-sheet.frame-black{--sheet-frame:#111820}.print-sheet.frame-gold{--sheet-frame:#c6a459}.print-sheet.frame-pastel{--sheet-frame:#cfe5e2}.print-sheet.frame-minimal{--sheet-frame:#e8e7e2}
.print-cell{position:relative;min-height:0;overflow:hidden;background:linear-gradient(145deg,#bac9c6,#7c9590)}
.print-cell img{width:100%;height:100%;display:block;object-fit:cover}.print-cell.costume-cell{background:#ececea}.print-cell.costume-cell img{object-fit:contain;object-position:center top;background:#ececea}
.print-cell.duo{display:grid;grid-template-columns:1fr 1fr}.print-cell.duo img{min-width:0}
.print-empty{display:grid;place-items:center;color:#6c7d85;font-size:11px;font-weight:900;letter-spacing:-.02em;text-align:center}
.print-empty:before{content:'6 × 4';display:grid;place-items:center;width:60px;height:34px;margin-bottom:5px;border:1px dashed #80959d;border-radius:8px;color:#58717a;font:800 13px Georgia,serif}
.preview-caption{position:absolute;z-index:4;right:8px;bottom:7px;padding:4px 7px;border-radius:999px;background:rgba(8,26,38,.78);color:#fff;font-size:7px;font-weight:900}
.picker-head{display:flex;justify-content:space-between;align-items:end;gap:10px}.picker-head strong{font-size:11px}.picker-head span{color:#708087;font-size:8px;text-align:right}
.result-thumb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.result-thumb-grid.normal{grid-template-columns:repeat(4,1fr)}
.result-thumb{position:relative;overflow:hidden;aspect-ratio:6/4;border:2px solid transparent;border-radius:12px;background:#d5dcde;padding:0;cursor:pointer;box-shadow:0 7px 15px rgba(19,60,80,.1);transition:.2s}
.result-thumb img{width:100%;height:100%;display:block;object-fit:cover}.result-thumb.costume{background:#e7e7e5}.result-thumb.costume img{object-position:center 8%}.result-thumb.duo{display:grid;grid-template-columns:1fr 1fr}.result-thumb.duo img{min-width:0}
.result-thumb:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(5,20,30,.78))}.result-thumb.selected{border-color:#238fcb;box-shadow:0 0 0 3px rgba(35,143,203,.18),0 10px 19px rgba(15,77,110,.18);transform:translateY(-2px)}.result-thumb.swap-ready{border-color:#f29a3f;box-shadow:0 0 0 3px rgba(242,154,63,.2),0 10px 19px rgba(15,77,110,.18)}
.result-thumb .pick-order{position:absolute;z-index:3;right:7px;top:7px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.92);color:#174765;font-size:12px;font-style:normal;box-shadow:0 5px 12px rgba(0,0,0,.18)}
.result-thumb.selected .pick-order{background:#238fcb;color:#fff}.result-thumb .thumb-label{position:absolute;z-index:3;left:8px;right:38px;bottom:7px;color:#fff;font-size:8px;font-weight:900;text-align:left}
.result-thumb.placed{display:none}
.print-cell.slot-button{border:0;padding:0;cursor:pointer}.print-cell.empty-slot{display:grid;place-items:center;border:2px dashed rgba(48,91,105,.32);background:rgba(255,255,255,.48);color:#6c828b}.print-cell.empty-slot span{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#fff;color:#335d6b;font-size:10px;font-weight:900}.print-cell.empty-slot small{font-size:7px;font-weight:800}.slot-badge{position:absolute;z-index:5;left:5px;top:5px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(21,86,113,.88);color:#fff;font-size:8px;font-weight:900}
.selection-line{margin:0;color:#62747d;font-size:8px;text-align:center}.next:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}

/* B04 — 6×4 가로 인화지 프레임과 5개가 겹쳐 보이는 순환형 커버플로우 */
.body.frame-mode{padding:4.8% 5% 14%;gap:2%}.body.frame-mode>.title{font-size:29px}
.frame-picker{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;flex:1;min-height:0}
.frame-main-preview{display:grid;place-items:center;min-height:0;padding:12px;border-radius:20px;background:linear-gradient(145deg,#dbe5e2,#f8faf8)}
.frame-main-sheet{--sheet-frame:#fff;position:relative;width:min(94%,460px);aspect-ratio:6/4;padding:12px;background:var(--sheet-frame);border:1px solid rgba(16,44,58,.2);box-shadow:0 16px 32px rgba(11,48,68,.2);transition:background .25s}
.frame-main-sheet.frame-white{--sheet-frame:#fff}.frame-main-sheet.frame-black{--sheet-frame:#111820}.frame-main-sheet.frame-gold{--sheet-frame:#c6a459}.frame-main-sheet.frame-pastel{--sheet-frame:#cfe5e2}.frame-main-sheet.frame-minimal{--sheet-frame:#e8e7e2}
.frame-main-sheet img{display:block;width:100%;height:100%;object-fit:cover}.frame-name{position:absolute;right:9px;bottom:8px;padding:4px 8px;border-radius:999px;background:rgba(7,25,37,.82);color:#fff;font-size:7px;font-weight:900}
.coverflow{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;gap:4px}.coverflow-track{position:relative;height:132px;overflow:hidden;perspective:800px}
.coverflow-card{position:absolute;left:50%;top:7px;width:132px;aspect-ratio:6/4;padding:6px;border:1px solid rgba(14,44,58,.2);background:var(--card-frame,#fff);box-shadow:0 10px 24px rgba(9,42,59,.22);cursor:pointer;transform:translateX(-50%);transition:.34s cubic-bezier(.2,.75,.25,1);z-index:10}
.coverflow-card[data-distance='-1']{transform:translateX(calc(-50% - 74px)) translateZ(-22px) rotateY(18deg) scale(.9);opacity:.82;z-index:8}.coverflow-card[data-distance='1']{transform:translateX(calc(-50% + 74px)) translateZ(-22px) rotateY(-18deg) scale(.9);opacity:.82;z-index:8}.coverflow-card[data-distance='-2']{transform:translateX(calc(-50% - 132px)) translateZ(-46px) rotateY(25deg) scale(.76);opacity:.5;z-index:6}.coverflow-card[data-distance='2']{transform:translateX(calc(-50% + 132px)) translateZ(-46px) rotateY(-25deg) scale(.76);opacity:.5;z-index:6}.coverflow-card.selected{outline:3px solid #238fcb;outline-offset:2px}.coverflow-card img{display:block;width:100%;height:100%;object-fit:cover}.coverflow-card small{position:absolute;left:6px;right:6px;bottom:-19px;color:#274653;font-size:7px;font-weight:900;text-align:center}
.coverflow-card.frame-white{--card-frame:#fff}.coverflow-card.frame-black{--card-frame:#111820}.coverflow-card.frame-gold{--card-frame:#c6a459}.coverflow-card.frame-pastel{--card-frame:#cfe5e2}.coverflow-card.frame-minimal{--card-frame:#e8e7e2}
.cover-arrow{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(20,61,80,.16);border-radius:50%;background:#fff;color:#174765;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 6px 15px rgba(17,59,79,.12)}

/* B01 — 8장 자동 촬영 진행 */
.body.normal-capture-mode{padding:4.5% 5% 5%;gap:1.8%;background:linear-gradient(180deg,#f7faf8,#eef5f2)}
.body.normal-capture-mode>.title{font-size:28px}.body.normal-capture-mode>.lead{font-size:9px}
.normal-camera{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:18px;background:#15231e url('../assets/backgrounds/gyeongbokgung.png') center/cover;box-shadow:0 14px 30px rgba(20,54,40,.2)}
.normal-camera:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 45%,rgba(0,0,0,.64))}.normal-camera .counter{z-index:3}.normal-camera .cut{z-index:4}
.capture-guide{position:absolute;z-index:4;left:12px;right:12px;bottom:11px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:8px;font-weight:800}.capture-guide strong{font-size:10px}
.capture-eight{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,52px);gap:6px}
.capture-slot{position:relative;overflow:hidden;border:2px solid transparent;border-radius:9px;background:#dfe6e2}.capture-slot.done{border-color:#39b98b}.capture-slot.current{border-color:#f29a3f;box-shadow:0 0 0 3px rgba(242,154,63,.17)}.capture-slot.empty{border-style:dashed;border-color:#aebdb7;background:linear-gradient(145deg,#edf2ef,#dbe4df)}.capture-slot b{position:absolute;z-index:4;right:4px;bottom:3px;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:rgba(8,28,21,.72);color:#fff;font-size:7px}
.auto-note{margin:0;color:#64736d;font-size:8px;text-align:center}

/* B02 — 촬영된 8장 전체에서 4장 선택 */
.body.normal-select-mode{padding:28px 5% 76px;gap:8px;background:linear-gradient(180deg,#f7faf8,#eef5f2)}
.body.normal-select-mode>.title{font-size:26px}.body.normal-select-mode>.lead{font-size:9px}
.photo-grid.normal-eight{flex:none;width:86%;max-width:410px;align-self:center;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,auto);gap:6px}.photo-grid.normal-eight .photo{aspect-ratio:6/4;border:0;border-radius:10px;background:#dfe6e2}.photo-grid.normal-eight .photo.selected{outline:3px solid #f29a3f;outline-offset:-3px}
.photo-grid.normal-eight .photo>b{z-index:6}

/* 두 사람이 함께 찍힌 가로 6:4 후보 사진 */
.pair-shot{position:absolute;inset:0;overflow:hidden;background-position:center;background-size:cover}
.pair-shot:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,18,28,.03),rgba(3,18,28,.18));pointer-events:none}
.pair-shot img{position:absolute;z-index:2;bottom:-2%;width:46%;height:102%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.pair-shot img:first-child{left:5%}.pair-shot img:nth-child(2){right:5%}

/* B03 — 6:4 작업 사진 1장 + 나머지 3장 + 카테고리별 커버플로우 */
.body.decorate-mode{padding:24px 5% 70px;gap:7px;background:linear-gradient(180deg,#f8faf8,#f0f5f2)}
.body.decorate-mode>.title{font-size:25px}.body.decorate-mode>.lead{font-size:8px;margin-bottom:2px}
.decorate-workspace{display:grid;grid-template-rows:auto auto auto;justify-content:center;gap:7px;flex:1;min-height:0}.decorate-workspace>*{width:min(100%,450px);justify-self:center}
.decorate-canvas{position:relative;aspect-ratio:6/4;overflow:hidden;border-radius:15px;background:#121a22;box-shadow:0 12px 25px rgba(10,39,53,.17)}
.decorate-canvas .pair-shot{z-index:1}.decorate-overlay{position:absolute;z-index:5;inset:0;pointer-events:none}.decorate-overlay .ar-item{position:absolute;display:grid;place-items:center;text-shadow:0 2px 5px rgba(0,0,0,.34)}.decorate-overlay .headband{left:31%;top:7%;font-size:36px;transform:rotate(-8deg)}.decorate-overlay .phrase{left:50%;bottom:8%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.88);color:#173d32;font-size:10px;font-weight:900;text-shadow:none;white-space:nowrap}.decorate-overlay .accent{right:10%;top:22%;font-size:26px}
.decorate-photo-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.decorate-thumb{position:relative;overflow:hidden;aspect-ratio:6/4;border:2px solid transparent;border-radius:8px;background:#dfe5e2;padding:0;cursor:pointer}.decorate-thumb.active{border-color:#238fcb;box-shadow:0 0 0 3px rgba(35,143,203,.16)}.decorate-thumb b{position:absolute;z-index:5;right:4px;top:4px;display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:rgba(7,29,41,.76);color:#fff;font-size:7px}.decorate-thumb.active b{background:#238fcb}
.sticker-flow-list{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:5px;min-height:0}.sticker-flow-row{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:4px;min-height:0;border-top:1px solid rgba(26,67,81,.13)}.sticker-flow-row>strong{color:#244854;font-size:9px}.sticker-flow{position:relative;height:52px;overflow:hidden;perspective:500px}.sticker-card{position:absolute;left:50%;top:5px;width:52px;height:42px;display:grid;place-items:center;border:1px solid rgba(25,64,80,.15);border-radius:10px;background:#fff;color:#153b47;font-size:16px;font-weight:900;box-shadow:0 5px 12px rgba(13,51,69,.12);transform:translateX(-50%);transition:.28s cubic-bezier(.2,.78,.25,1);cursor:pointer}.sticker-card[data-distance='-1']{transform:translateX(calc(-50% - 48px)) rotateY(20deg) scale(.88);opacity:.78;z-index:2}.sticker-card[data-distance='1']{transform:translateX(calc(-50% + 48px)) rotateY(-20deg) scale(.88);opacity:.78;z-index:2}.sticker-card[data-distance='-2']{transform:translateX(calc(-50% - 84px)) rotateY(28deg) scale(.7);opacity:.42}.sticker-card[data-distance='2']{transform:translateX(calc(-50% + 84px)) rotateY(-28deg) scale(.7);opacity:.42}.sticker-card.selected{z-index:5;border-color:#238fcb;background:#e8f6fc;box-shadow:0 0 0 2px rgba(35,143,203,.17),0 7px 15px rgba(13,51,69,.16)}.sticker-card small{font-size:7px}

const nextButton=foot.querySelector('.next');
body.classList.toggle('welcome-mode',s.kind==='welcome');
body.classList.toggle('mode-mode',s.kind==='mode');
body.classList.toggle('payment-mode',s.kind==='payment');
body.classList.toggle('result-layout-mode',s.kind==='ai-result-select'||(s.kind==='layout'&&s.variant==='normal'));
body.classList.toggle('frame-mode',s.kind==='frame');
body.classList.toggle('normal-capture-mode',s.kind==='capture'&&s.variant==='normal');
body.classList.toggle('normal-select-mode',s.kind==='select'&&s.variant==='normal');
body.classList.toggle('decorate-mode',s.kind==='decorate');
body.classList.toggle('no-action',!actionLabel);
body.dataset.kind=s.kind;
foot.style.display=actionLabel?'block':'none';
nextButton.textContent=actionLabel||'';
body.innerHTML=html;
if(s.kind==='welcome'){
let detected=true, ready=false;
const campip=body.querySelector('#campip'),detect=body.querySelector('#detect'),
      detTitle=body.querySelector('#detTitle'),detSub=body.querySelector('#detSub'),
      detFaces=body.querySelector('#detFaces'),toastMsg=body.querySelector('#toastMsg'),
      simToggle=body.querySelector('#simToggle'),startInvite=body.querySelector('#startInvite'),
      languageFloat=body.querySelector('.language-float');
startInvite.onclick=()=>{
  startInvite.classList.add('is-hidden');
  body.classList.add('language-open');
  languageFloat.classList.remove('is-gated');
  languageFloat.classList.add('is-open');
};
detFaces.innerHTML=FACES.map(()=>'<i class="pending"></i>').join('');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){toastMsg.textContent=t;toastMsg.classList.add('on');setTimeout(()=>toastMsg.classList.remove('on'),1900)}

/* 대기 중 백그라운드에서 자동으로 인원수 판별 + 얼굴만 추출해 둔다 (시작을 눌러도 촬영 단계 없음) */
let runId=0;
async function autoExtract(){
  const my=++runId;
  ready=false;
  campip.classList.remove('ready');
  const slots=[...detFaces.querySelectorAll('i')];
  slots.forEach(el=>{el.innerHTML='';el.className='pending'});
  detTitle.textContent='사람 감지 중…';
  detSub.textContent='카메라 영상에서 인원수를 확인하고 있습니다';
  await wait(700); if(my!==runId||!detected)return;
  detTitle.textContent=`사람 ${FACES.length}명 감지됨`;
  detSub.textContent='얼굴을 자동으로 추출하는 중…';
  for(let i=0;i<FACES.length;i++){
    await wait(430); if(my!==runId||!detected)return;
    slots[i].innerHTML=`<img src="${FACES[i]}" alt="">`;
    slots[i].className='done';
  }
  sessionStorage.setItem('capturedFaces',JSON.stringify(FACES.map(f=>f.replace('../',''))));
  detSub.textContent=`얼굴 ${FACES.length}명 추출 완료 · 시작을 누르면 바로 설정으로 넘어갑니다`;
  campip.classList.add('ready');
  ready=true;
}
function syncDetect(){
  campip.classList.toggle('no-person',!detected);
  detect.classList.toggle('off',!detected);
  detFaces.style.display=detected?'flex':'none';
  if(detected){autoExtract()}
  else{
    runId++; ready=false;
    sessionStorage.removeItem('capturedFaces');
    detTitle.textContent='감지된 사람 없음';
    detSub.textContent='카메라 앞에 서면 자동으로 인원과 얼굴을 잡습니다';
  }
}
simToggle.onclick=()=>{detected=!detected;simToggle.textContent=detected?'감지 없음으로 전환':'사람 감지로 전환';syncDetect()};
body.querySelectorAll('.language-start').forEach(button=>button.onclick=()=>{
  sessionStorage.setItem('photoLanguage',button.lang);
  if(!detected){toast('카메라 앞에 서 주세요 · 사람이 감지되지 않았습니다');return}
  if(!ready){toast('얼굴을 추출하는 중입니다 · 잠시만요');return}
  location.href='screen.html?id=common-02';
});
syncDetect();
}
if(s.kind==='notice'){
body.querySelector('.lang-return').onclick=()=>{location.href='screen.html?id=common-01'};
nextButton.onclick=()=>{location.href='screen.html?id=common-03'};
}
if(s.kind==='mode')body.querySelectorAll('.mode-card').forEach(card=>card.onclick=()=>{body.querySelectorAll('.mode-card').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');sessionStorage.setItem('photoMode',card.dataset.mode);setTimeout(()=>{location.href='screen.html?id=common-04'},260)});
if(s.kind==='payment')body.querySelectorAll('.tile').forEach(tile=>tile.onclick=()=>{body.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));tile.classList.add('selected');const nextId=sessionStorage.getItem('photoMode')==='normal'?'normal-01':'ai-01';setTimeout(()=>{location.href=`screen.html?id=${nextId}`},360)});
if(s.kind==='select'){
const required=s.variant==='normal'?4:2;
const selected=new Set();
const status=body.querySelector('.selection-status');
if(s.variant==='normal'){
  nextButton.disabled=true;
  nextButton.onclick=()=>{
    if(selected.size!==required)return;
    sessionStorage.setItem('selectedNormalCandidates',JSON.stringify([...selected]));
    location.href='screen.html?id=normal-03';
  };
}
body.querySelectorAll('.photo').forEach(photo=>photo.onclick=()=>{
const index=Number(photo.dataset.index);
if(selected.has(index))selected.delete(index);else if(selected.size<required)selected.add(index);
body.querySelectorAll('.photo').forEach(card=>{const cardIndex=Number(card.dataset.index);const order=[...selected].indexOf(cardIndex);card.classList.toggle('selected',order>=0);card.querySelector('b').textContent=order>=0?order+1:'＋'});
status.textContent=`선택 ${selected.size} / ${required}${s.variant==='normal'?(selected.size===required?' · 선택 완료를 눌러 AR 꾸미기로 이동합니다.':' · 8장 중 네 장을 선택해 주세요.'):' · 선택한 2장만 업로드됩니다.'}`;
if(s.variant==='normal'){
  nextButton.disabled=selected.size!==required;
  if(selected.size===required)sessionStorage.setItem('selectedNormalCandidates',JSON.stringify([...selected]));
  else sessionStorage.removeItem('selectedNormalCandidates');
}else if(selected.size===required){setTimeout(()=>{location.href='screen.html?id=ai-04'},420)}
});
}

if(s.kind==='decorate'){
  const selectedIndexes=JSON.parse(sessionStorage.getItem('selectedNormalCandidates')||'[0,1,2,3]');
  const chosen=selectedIndexes.slice(0,4).map(index=>NORMAL_PAIRS[index]||NORMAL_PAIRS[0]);
  const main=body.querySelector('#decorateMain');
  const thumbs=[...body.querySelectorAll('.decorate-thumb')];
  let activePhoto=0;
  const syncPhoto=()=>{
    main.innerHTML=pairMarkup(chosen[activePhoto],`현재 꾸미는 사진 ${activePhoto+1}`);
    thumbs.forEach((thumb,index)=>{
      thumb.innerHTML=pairMarkup(chosen[index],`선택한 사진 ${index+1}`)+`<b>${index+1}</b>`;
      thumb.classList.toggle('active',index===activePhoto);
    });
  };
  thumbs.forEach((thumb,index)=>thumb.onclick=()=>{activePhoto=index;syncPhoto()});
  const overlayTargets={headband:body.querySelector('#arHeadband'),phrase:body.querySelector('#arPhrase'),accent:body.querySelector('#arAccent')};
  body.querySelectorAll('.sticker-flow-row').forEach(row=>{
    const cards=[...row.querySelectorAll('.sticker-card')];
    let active=Math.max(0,cards.findIndex(card=>card.classList.contains('selected')));
    const signedDistance=index=>{let d=index-active;const half=Math.floor(cards.length/2);if(d>half)d-=cards.length;if(d<-half)d+=cards.length;return d};
    const syncFlow=()=>{
      cards.forEach((card,index)=>{const d=signedDistance(index);card.dataset.distance=String(d);card.classList.toggle('selected',d===0)});
      const value=cards[active].dataset.value;
      overlayTargets[row.dataset.category].textContent=value==='없음'?'':value;
    };
    cards.forEach((card,index)=>card.onclick=()=>{active=index;syncFlow()});
    syncFlow();
  });
  syncPhoto();
}

/* 화면별 다음 단계로 이동하는 클릭 체인 */
const NEXT={'ai-02':'ai-03','ai-04':'ai-05','ai-05':'result-01',
            'normal-03':'normal-04','normal-04':'normal-05','normal-05':'result-01',
            'result-01':'result-02','result-02':'result-03','result-03':'common-01'};
const go=id=>{location.href='screen.html?id='+id};
if(NEXT[id]){
  const target=NEXT[id];
  if(actionLabel){nextButton.onclick=()=>go(target)}
  else{
    const bar=document.createElement('button');
    bar.type='button'; bar.className='flow-next';
    bar.textContent=({'ai-02':'촬영 완료 · 사진 고르기','normal-01':'촬영 완료 · 사진 고르기','ai-04':'AI 결과 2장 보기',
      'result-01':'인쇄 상태 확인','result-02':'사진 받았어요','result-03':'처음으로'}[id])||'다음 단계 →';
    bar.onclick=()=>go(target);
    body.appendChild(bar);
    body.style.paddingBottom='86px';
  }
}
if(s.kind==='frame'){
  const cards=[...body.querySelectorAll('.coverflow-card')];
  const sheet=body.querySelector('#frameMainSheet');
  const label=body.querySelector('#frameName');
  let active=Math.max(0,cards.findIndex(card=>card.dataset.frame===(sessionStorage.getItem('selectedFrame')||'frame-white')));
  const signedDistance=(index)=>{let d=index-active;const half=Math.floor(cards.length/2);if(d>half)d-=cards.length;if(d<-half)d+=cards.length;return d};
  const syncFrame=()=>{
    cards.forEach((card,index)=>{const d=signedDistance(index);card.dataset.distance=String(d);card.classList.toggle('selected',d===0)});
    const chosen=cards[active];
    sheet.className=`frame-main-sheet ${chosen.dataset.frame}`;
    label.textContent=`${chosen.dataset.label} · 6×4 가로`;
    sessionStorage.setItem('selectedFrame',chosen.dataset.frame);
  };
  cards.forEach((card,index)=>card.onclick=()=>{active=index;syncFrame()});
  body.querySelector('#framePrev').onclick=()=>{active=(active-1+cards.length)%cards.length;syncFrame()};
  body.querySelector('#frameNext').onclick=()=>{active=(active+1)%cards.length;syncFrame()};
  nextButton.onclick=()=>go('normal-05');
  syncFrame();
}
if(s.kind==='layout'&&s.variant==='normal'){
  const order=[null,null,null,null];
  const cards=[...body.querySelectorAll('.result-thumb')];
  const status=body.querySelector('.selection-line');
  const sheet=body.querySelector('#printSheet');
  const frame=sessionStorage.getItem('selectedFrame')||'frame-white';
  const selectedIndexes=JSON.parse(sessionStorage.getItem('selectedNormalCandidates')||'[0,1,2,3]');
  const chosenPairs=selectedIndexes.slice(0,4).map(index=>NORMAL_PAIRS[index]||NORMAL_PAIRS[0]);
  body.querySelector('.picker-head span').textContent='사진을 누르면 다음 빈칸에 배치';
  sheet.classList.add(frame);
  cards.forEach((card,index)=>{
    card.dataset.pairIndex=String(index);
    card.classList.remove('selected','swap-ready');
    card.innerHTML=pairMarkup(chosenPairs[index],`선택한 일반 사진 ${index+1}`)+`<span class="thumb-label">사진 ${index+1}</span><b class="pick-order">＋</b>`;
  });
  const cardByValue=value=>cards.find(card=>Number(card.dataset.result)===value);
  const cellHtml=(value,index)=>{
    if(value===null)return `<button class="print-cell slot-button empty-slot" type="button" data-slot="${index}"><span>${index+1}</span><small>사진 선택</small></button>`;
    const card=cardByValue(value);
    return `<button class="print-cell slot-button" type="button" data-slot="${index}" aria-label="${index+1}번 배치 취소">${pairMarkup(chosenPairs[Number(card.dataset.pairIndex)],'일반 4컷 인쇄 사진')}<span class="slot-badge">${index+1}</span></button>`;
  };
  const syncFour=()=>{
    cards.forEach(card=>{
      const value=Number(card.dataset.result),position=order.indexOf(value);
      card.classList.toggle('placed',position>=0);
      card.querySelector('.pick-order').textContent='＋';
    });
    sheet.className=`print-sheet four ${frame}`;
    sheet.innerHTML=order.map(cellHtml).join('')+'<span class="preview-caption">6×4 · 빈칸부터 순서대로 배치</span>';
    const filled=order.filter(value=>value!==null).length;
    status.textContent=filled===4?'사진 4장 배치 완료 · 선택 완료를 눌러 주세요':`배치 ${filled} / 4 · 아래 사진을 누르면 다음 빈칸에 들어갑니다`;
    nextButton.disabled=filled!==4;
    sheet.querySelectorAll('.slot-button').forEach(slot=>slot.onclick=()=>{
      const index=Number(slot.dataset.slot);
      if(order[index]===null)return;
      order[index]=null;
      syncFour();
    });
  };
  cards.forEach(card=>card.onclick=()=>{
    const value=Number(card.dataset.result);
    if(order.includes(value))return;
    const empty=order.indexOf(null);
    if(empty<0)return;
    order[empty]=value;
    syncFour();
  });
  nextButton.disabled=true;
  nextButton.onclick=()=>{if(order.includes(null))return;sessionStorage.setItem('selectedNormalResults',JSON.stringify(order));go('result-01')};
  syncFour();
}
if(s.kind==='ai-result-select'){
  const selected=[];
  const cards=[...body.querySelectorAll('.result-thumb')];
  const status=body.querySelector('.selection-line');
  const sheet=body.querySelector('#printSheet');
  const frame=sessionStorage.getItem('selectedFrame')||'frame-white';
  sheet.classList.add(frame);
  const cellHtml=card=>{
    const images=card.dataset.images.split('|');
    return `<div class="print-cell ${images.length>1?'duo':''} ${card.classList.contains('costume')?'costume-cell':''}">${images.map(src=>`<img src="${src}" alt="선택한 인쇄 사진">`).join('')}</div>`;
  };
  const syncPicker=()=>{
    cards.forEach(card=>{
      const value=Number(card.dataset.result),order=selected.indexOf(value);
      card.classList.toggle('selected',order>=0);
      card.querySelector('.pick-order').textContent=order>=0?String(order+1):'＋';
    });
    sheet.classList.toggle('one',selected.length!==2);
    sheet.classList.toggle('two',selected.length===2);
    const chosen=selected.map(value=>cards.find(card=>Number(card.dataset.result)===value)).filter(Boolean);
    sheet.innerHTML=chosen.length?chosen.map(cellHtml).join(''):`<div class="print-cell print-empty">사진을 선택하면<br>인쇄 모습을 보여드려요</div>`;
    sheet.insertAdjacentHTML('beforeend',`<span class="preview-caption">${selected.length===2?'4×6 · 위아래 2장':'6×4 · 한 장 크게'}</span>`);
    status.textContent=`선택 ${selected.length} / 최대 2 · ${selected.length===2?'4×6 세로 용지 위아래 배치':selected.length===1?'6×4 가로 용지 한 장 크게 배치':'재생성 없이 선택한 결과를 인쇄합니다'}`;
    nextButton.disabled=selected.length===0;
  };
  cards.forEach(card=>card.onclick=()=>{
    const value=Number(card.dataset.result),at=selected.indexOf(value);
    if(at>=0)selected.splice(at,1);else if(selected.length<2)selected.push(value);
    syncPicker();
  });
  nextButton.onclick=()=>{
    if(!selected.length)return;
    sessionStorage.setItem('selectedAiResults',JSON.stringify(selected));
    go('result-01');
  };
  syncPicker();
}
if(s.kind==='progress')setTimeout(()=>{},0);
}render();
</script>
</body>
</html>
